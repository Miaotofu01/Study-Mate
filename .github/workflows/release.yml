name: Release
run-name: Release (${{ inputs.bump }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: studymate-release-main
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'Miaotofu01/Study-Mate' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    # 等待窗口本身就要 30 分钟（scripts/release/release.mjs 的 npm 异步入库等待），
    # 20 分钟会把还在正常等待的任务掐掉。
    timeout-minutes: 40
    environment: npm
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUMP: ${{ inputs.bump }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      # npm 异步入库的等待上限；要临时加长就调这里，别超上面的 job 超时。
      RELEASE_NPM_WAIT_SECONDS: '1800'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11 --ignore-scripts
      # 正式发包的 tarball 里有 dist/client.js（package.json 的 exports["./client"]），它由
      # release.mjs 的 packPackage 在**每次真正打包之前**现跑构建产出（打包带 --ignore-scripts，
      # prepack 不触发，产物只能由那条路径自己保证）。构建期工具 esbuild / postcss 全在
      # devDependencies 里，而这里是一个全新的 checkout（checks job 的 npm ci 看不见），
      # 所以发布 job 自己必须装齐 devDependencies。这里**不再额外跑一次构建**：prepare 在
      # commit/tag 之前就会通过 packPackage 构建并试打包，构建失败当场停住、不会留下版本
      # commit 与 tag；publish 打包前也会再构建一次，每次构建都紧跟一次真打包。
      # --ignore-scripts：本仓库的 devDependencies 只需要解包（esbuild 走平台包，生命周期脚本
      # 是多余的）；产物由 release.mjs 自己的 npm run 产出，不靠依赖的 install/postinstall。
      - name: Install build-time devDependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Prepare changelog, version commit and tag
        run: node scripts/release/release.mjs prepare
      - name: Build plugin ZIP, publish npm through OIDC, and attach ZIP to GitHub Release
        run: node scripts/release/release.mjs publish
