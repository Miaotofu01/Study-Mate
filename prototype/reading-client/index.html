<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════════════
     阅读端原型 · 一次性代码，不要合进主干
     ═══════════════════════════════════════════════════════════════════════════
     要回答的问题只有一个：**阅读端该长什么样**。
     目标态（docs/设计/目标态规格.md §4）定了信息架构——今天学什么 / 科目路线图 /
     课件 / 搜索 / 问答面板——没定这些界面长什么样、主要动作是什么。这个原型把同一份
     真数据摆成三种结构不同的版式，用底部那条切换（?variant=A|B|C）来回翻。

     怎么跑：仓库根 `npm run prototype`，然后打开它打印的地址。
     （直接双击本文件不行：浏览器不许 file:// 页面读同目录的 JSON。）
     数据从哪来：data/workspace.json 由 tools/build-data.py 从 examples/ 的示例学习
     工作区抽出，正文一个字没改；作答与问答回答是内存里的桩。

     合入真代码时：整个 prototype/ 目录走一次性分支，主干只留选中的那套版式。
     ═══════════════════════════════════════════════════════════════════════════ -->
